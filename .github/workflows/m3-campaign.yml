name: m3 キャンペーン自動参加

on:
  schedule:
    # 毎日 7:10 JST (= 22:10 UTC)
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ボタンを押さずに確認だけする"
        type: boolean
        default: false

concurrency:
  group: m3-campaign
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: テスト
        run: python -m pytest -q tests
      - name: キャンペーンに参加
        env:
          M3_LOGIN_ID: ${{ secrets.M3_LOGIN_ID }}
          M3_PASSWORD: ${{ secrets.M3_PASSWORD }}
        run: python -m m3_campaign.runner ${{ inputs.dry_run && '--dry-run' || '' }}
